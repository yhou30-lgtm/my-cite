<div class="grid" id="grid"><figure class="card quote" data-tags="Philosophy" data-text="the life which is unexamined is not worth living. plato (socrates) apology, trans. benjamin jowett philosophy"><div class="tag">Philosophy</div><blockquote><p>The life which is unexamined is not worth living.</p></blockquote><figcaption><span class="who">Plato (Socrates)</span><div class="src">Apology, trans. Benjamin Jowett</div></figcaption></figure><figure class="card quote" data-tags="Philosophy" data-text="men are disturbed, not by things, but by the principles and notions which they form concerning things. epictetus enchiridion 5, trans. elizabeth carter philosophy"><div class="tag">Philosophy</div><blockquote><p>Men are disturbed, not by things, but by the principles and notions which they form concerning things.</p></blockquote><figcaption><span class="who">Epictetus</span><div class="src">Enchiridion 5, trans. Elizabeth Carter</div></figcaption></figure><figure class="card quote" data-tags="Business" data-text="we simply attempt to be fearful when others are greedy and to be greedy only when others are fearful. warren buffett berkshire hathaway chairman&#x27;s letter, 1986 business"><div class="tag">Business</div><blockquote><p>We simply attempt to be fearful when others are greedy and to be greedy only when others are fearful.</p></blockquote><figcaption><span class="who">Warren Buffett</span><div class="src">Berkshire Hathaway chairman&#x27;s letter, 1986</div></figcaption></figure><figure class="card quote" data-tags="Business" data-text="price is what you pay; value is what you get. warren buffett (quoting ben graham) berkshire hathaway shareholder letter, 2008 business"><div class="tag">Business</div><blockquote><p>Price is what you pay; value is what you get.</p></blockquote><figcaption><span class="who">Warren Buffett (quoting Ben Graham)</span><div class="src">Berkshire Hathaway shareholder letter, 2008</div></figcaption></figure><figure class="card quote" data-tags="Poetry" data-text="i took the one less traveled by, / and that has made all the difference. robert frost the road not taken poetry"><div class="tag">Poetry</div><blockquote><p>I took the one less traveled by, / And that has made all the difference.</p></blockquote><figcaption><span class="who">Robert Frost</span><div class="src">The Road Not Taken</div></figcaption></figure><figure class="card quote" data-tags="Poetry" data-text="to strive, to seek, to find, and not to yield. alfred, lord tennyson ulysses poetry"><div class="tag">Poetry</div><blockquote><p>To strive, to seek, to find, and not to yield.</p></blockquote><figcaption><span class="who">Alfred, Lord Tennyson</span><div class="src">Ulysses</div></figcaption></figure><figure class="card quote" data-tags="Poetry" data-text="i celebrate myself, and sing myself, / and what i assume you shall assume. walt whitman song of myself, 1 poetry"><div class="tag">Poetry</div><blockquote><p>I celebrate myself, and sing myself, / And what I assume you shall assume.</p></blockquote><figcaption><span class="who">Walt Whitman</span><div class="src">Song of Myself, 1</div></figcaption></figure><figure class="card quote" data-tags="Poetry" data-text="things fall apart; the centre cannot hold; / mere anarchy is loosed upon the world. w. b. yeats the second coming poetry"><div class="tag">Poetry</div><blockquote><p>Things fall apart; the centre cannot hold; / Mere anarchy is loosed upon the world.</p></blockquote><figcaption><span class="who">W. B. Yeats</span><div class="src">The Second Coming</div></figcaption></figure></div>
